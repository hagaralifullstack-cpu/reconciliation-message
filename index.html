<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رسالة صلح | اعتذار صادق من القلب</title>
  <meta name="description" content="رحلة اعتذار وتقدير محترمة وتفاعلية بالعامية المصرية تنتهي بشهادة صلح رسمية." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --ink-main: #0f172a;
      --ink-muted: #475569;
      --ink-soft: #64748b;
      --indigo: #4338ca;
      --indigo-dark: #312e81;
      --indigo-deep: #1e1b4b;
      --indigo-soft: #eef2ff;
      --gold: #b45309;
      --gold-bright: #d97706;
      --gold-soft: #fffbeb;
      --emerald: #047857;
      --emerald-soft: #ecfdf5;
      --border-soft: #e2e8f0;
      --border-indigo: #e0e7ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Readex Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #f3f5fc 55%, #fffcf5 100%);
      color: var(--ink-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    .font-display {
      font-family: "Amiri", Georgia, serif;
    }

    button, input, textarea {
      font-family: inherit;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
      display: none;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-indigo);
    }

    .topbar-inner {
      max-width: 1152px;
      margin: 0 auto;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-btn {
      background: none;
      border: none;
      padding: 4px 0;
      font-family: "Amiri", Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--indigo-deep);
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-btn:hover {
      color: var(--gold);
    }

    .header-meta {
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-meta strong {
      color: var(--indigo-dark);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      min-height: 40px;
      min-width: 40px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: #f8fafc;
    }

    .icon-btn.active-music {
      border-color: #a5b4fc;
      background: var(--indigo-soft);
      color: var(--indigo-dark);
    }

    .icon-btn.active-nature {
      border-color: #a7f3d0;
      background: var(--emerald-soft);
      color: var(--emerald);
    }

    .progress-track {
      height: 2px;
      width: 100%;
      background: #f1f5f9;
      display: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(270deg, #f59e0b 0%, #4f46e5 55%, #059669 100%);
      transition: width 0.3s ease;
    }

    /* Main Layout */
    .main-wrap {
      max-width: 1152px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 48px;
      flex: 1;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .main-wrap {
        padding: 36px 24px 56px;
      }
      .grid-layout {
        grid-template-columns: 5fr 7fr;
      }
      .aside-sticky {
        position: sticky;
        top: 76px;
      }
    }

    /* Character Stage Card */
    .stage-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      padding: 18px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      user-select: none;
    }

    .stage-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.65;
      background: radial-gradient(circle at 50% 45%, rgba(99, 102, 241, 0.08), rgba(226, 232, 240, 0.25) 60%, transparent 85%);
      transition: background 0.4s ease;
    }

    .stage-glow.reconciled {
      background: radial-gradient(circle at 50% 45%, rgba(16, 185, 129, 0.14), rgba(99, 102, 241, 0.06) 55%, transparent 80%);
    }

    .captions-row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 6px;
      min-height: 28px;
      text-align: center;
    }

    .caption-chip {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .caption-sender {
      border: 1px solid var(--border-indigo);
      background: #f5f7ff;
      color: var(--indigo-deep);
    }

    .caption-recipient {
      border: 1px solid var(--border-soft);
      background: #f8fafc;
      color: #334155;
    }

    .stage-svg {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      height: 175px;
      display: block;
      margin: 0 auto;
    }

    .char-names {
      position: relative;
      z-index: 2;
      max-width: 300px;
      margin: 4px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    /* Desktop Chapter List */
    .chapters-card {
      display: none;
      margin-top: 16px;
      border-radius: 18px;
      border: 1px solid var(--border-indigo);
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    @media (min-width: 1024px) {
      .chapters-card {
        display: block;
      }
    }

    .chapters-title {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: #92400e;
    }

    .chapters-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .chapter-item.current {
      background: var(--indigo-soft);
      color: var(--indigo-deep);
      font-weight: 700;
    }

    .chapter-item.done {
      color: var(--emerald);
    }

    /* Scene Card */
    .scene-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--border-indigo);
      background: #ffffff;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      animation: fadeSlideIn 0.35s ease;
    }

    @media (min-width: 640px) {
      .scene-card {
        padding: 32px;
      }
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
    }

    .scene-title {
      margin: 0 0 10px;
      font-family: "Amiri", Georgia, serif;
      font-size: 30px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--ink-main);
    }

    @media (min-width: 640px) {
      .scene-title {
        font-size: 36px;
      }
    }

    .scene-subtitle {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--ink-muted);
      line-height: 1.75;
    }

    /* Form & Interactive Controls */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (min-width: 640px) {
      .form-grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .input-box, .textarea-box {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: #f8fafc;
      padding: 11px 14px;
      font-size: 14px;
      color: var(--ink-main);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .input-box:focus, .textarea-box:focus {
      outline: none;
      border-color: var(--indigo);
      background: #ffffff;
    }

    .textarea-box {
      line-height: 1.75;
      resize: vertical;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .choice-grid.cols-2 { grid-template-columns: 1fr 1fr; }
      .choice-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    }

    .choice-btn {
      min-height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      padding: 12px 14px;
      text-align: right;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      color: #1e293b;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: #c7d2fe;
      background: #f8fafc;
    }

    .choice-btn.selected {
      border-color: var(--indigo);
      background: #eef2ff;
      color: var(--indigo-deep);
    }

    .choice-btn.selected-amber {
      border-color: var(--gold-bright);
      background: #fef3c7;
      color: #451a03;
    }

    .choice-btn.selected-emerald {
      border-color: var(--emerald);
      background: var(--emerald-soft);
      color: #064e3b;
    }

    .choice-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .choice-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .choice-desc {
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    /* Primary & Secondary CTA Buttons */
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }

    @media (min-width: 640px) {
      .btn-row {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }
    }

    .btn-primary {
      min-height: 48px;
      border: none;
      border-radius: 12px;
      padding: 12px 26px;
      background: linear-gradient(270deg, #4338ca 0%, #312e81 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.94;
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      background: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-amber {
      min-height: 48px;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 12px 20px;
      background: #fffbeb;
      color: #78350f;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-amber:hover {
      background: #fef3c7;
    }

    .btn-outline {
      min-height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 20px;
      background: #ffffff;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-outline:hover {
      background: #f8fafc;
    }

    /* Ambient Audio Strip in Confession */
    .audio-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: #f8fafc;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .audio-strip-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .audio-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .audio-btn {
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .audio-btn.is-music {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #ffffff;
    }

    .audio-btn.is-nature {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #ffffff;
    }

    /* Letter Box */
    .letter-box {
      border-radius: 14px;
      border: 1px solid var(--border-indigo);
      background: linear-gradient(135deg, rgba(238, 242, 255, 0.55) 0%, #ffffff 55%, rgba(255, 251, 235, 0.55) 100%);
      padding: 20px;
      margin-bottom: 18px;
    }

    .letter-box p {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.9;
      color: #1e293b;
    }

    .letter-box p:last-child {
      margin-bottom: 0;
    }

    /* Bubbles Arena */
    .bubbles-arena {
      min-height: 270px;
      border-radius: 16px;
      border: 1px solid var(--border-indigo);
      background: linear-gradient(135deg, #f8fafc 0%, #f5f7ff 55%, #fffcf3 100%);
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .excuse-bubble {
      min-height: 52px;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      animation: floatY 3.2s ease-in-out infinite;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .excuse-bubble:hover {
      transform: scale(1.05);
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .final-apology-orb {
      width: 158px;
      height: 158px;
      border-radius: 50%;
      border: 4px solid #fde68a;
      background: linear-gradient(135deg, #4338ca 0%, #1e1b4b 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(49, 46, 129, 0.24);
      margin: 0 auto 12px;
      font-family: "Amiri", Georgia, serif;
      font-size: 30px;
      font-weight: 700;
    }

    /* Promises Jar + Signature */
    .promises-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (min-width: 768px) {
      .promises-split {
        grid-template-columns: 2fr 1fr;
      }
    }

    .jar-box {
      border-radius: 14px;
      border: 1px solid #fde68a;
      background: linear-gradient(180deg, rgba(255, 251, 235, 0.5) 0%, rgba(238, 242, 255, 0.45) 100%);
      padding: 16px;
      text-align: center;
    }

    .sig-pad-wrap {
      position: relative;
      border-radius: 14px;
      border: 1.5px dashed rgba(217, 119, 6, 0.65);
      background: #fffdf7;
      overflow: hidden;
      height: 150px;
    }

    #signature-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .sig-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
    }

    /* Scratch Card */
    .scratch-wrap {
      position: relative;
      height: 220px;
      width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(252, 211, 77, 0.85);
      background: linear-gradient(135deg, #fffbeb 0%, #ffffff 50%, #eef2ff 100%);
      overflow: hidden;
      user-select: none;
    }

    .scratch-underlying {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 8px;
    }

    #scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    /* Hold-to-Forgive Button */
    .hold-arena {
      border-radius: 16px;
      border: 1px solid var(--border-indigo);
      background: linear-gradient(180deg, rgba(238, 242, 255, 0.4) 0%, rgba(255, 251, 235, 0.35) 100%);
      padding: 28px 20px;
      text-align: center;
    }

    .hold-btn {
      position: relative;
      overflow: hidden;
      min-height: 66px;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      border: 2px solid var(--indigo);
      background: #ffffff;
      color: var(--indigo-deep);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      padding: 14px 20px;
    }

    .hold-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(270deg, #4338ca 0%, #312e81 55%, #047857 100%);
      transform-origin: right center;
      transform: scaleX(0);
      pointer-events: none;
    }

    .hold-label {
      position: relative;
      z-index: 2;
      transition: color 0.15s ease;
    }

    /* Ornate Official Certificate */
    .cert-outer {
      border-radius: 18px;
      border: 3px solid var(--indigo-deep);
      background: #fffdf7;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(30, 27, 75, 0.08);
    }

    .cert-mid {
      border-radius: 12px;
      border: 2px solid rgba(180, 83, 9, 0.8);
      padding: 4px;
    }

    .cert-inner {
      position: relative;
      border-radius: 8px;
      border: 1px solid rgba(217, 119, 6, 0.5);
      background: #fffdf7;
      padding: 28px 20px;
    }

    @media (min-width: 640px) {
      .cert-inner {
        padding: 36px 32px;
      }
    }

    .cert-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      color: rgba(180, 83, 9, 0.72);
      pointer-events: none;
    }

    .cert-footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: center;
      text-align: center;
      border-top: 1px solid #fde68a;
      padding-top: 20px;
      margin-top: 20px;
    }

    @media (min-width: 640px) {
      .cert-footer-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="brand-btn" id="brand-home-btn">رسالة صلح</button>
      <div class="header-meta" id="header-meta">
        <strong id="header-scene-label">تجهيز الرسالة</strong>
        <span id="header-step-count" class="hidden"></span>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn hidden" id="btn-back" aria-label="رجوع">رجوع</button>
        <button type="button" class="icon-btn" id="btn-ambient" title="تشغيل موسيقى هادئة أو صوت طبيعة">صوت هادئ</button>
        <button type="button" class="icon-btn" id="btn-mute" aria-label="كتم أو تشغيل الصوت">🔊</button>
      </div>
    </div>

        if (this.ambientGain) { try { this.ambientGain.disconnect(); } catch (e) {} this.ambientGain = null; }

      SoundEngine.prototype.startAmbient = function (mode) {
        var ctx = this.getCtx();
        if (!ctx) return;
        var master = ctx.createGain();
        master.gain.setValueAtTime(0.001, ctx.currentTime);
        master.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2);
        master.connect(ctx.destination);
        this.ambientGain = master;

        var self = this;
        if (mode === 'music') {
          var chords = [
            [261.63, 329.63, 392.0, 493.88],
            [220.0, 261.63, 329.63, 392.0],
            [174.61, 261.63, 329.63, 440.0],
            [196.0, 293.66, 329.63, 493.88]
          ];
          var playChord = function () {
            if (!self.ambientGain || self.muted || self.ambientMode !== 'music') return;
            var ch = chords[self.chordIdx % chords.length];
            self.chordIdx += 1;
            ch.forEach(function (freq, idx) {
              var start = ctx.currentTime + idx * 0.28;
              var osc = ctx.createOscillator();
              var flt = ctx.createBiquadFilter();
              var g = ctx.createGain();
              osc.type = idx === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(freq, start);
              flt.type = 'lowpass';
              flt.frequency.setValueAtTime(950, start);
              g.gain.setValueAtTime(0.0001, start);
              g.gain.linearRampToValueAtTime(0.028, start + 0.6);
              g.gain.exponentialRampToValueAtTime(0.0008, start + 4.4);
              osc.connect(flt); flt.connect(g); g.connect(self.ambientGain);
              osc.start(start); osc.stop(start + 4.5);
            });
          };

          this.musicTimer = setInterval(playChord, 4200);

          var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
          var data = buf.getChannelData(0);

            b1 = 0.963 * b1 + w * 0.2965164;
            b2 = 0.57 * b2 + w * 1.0526913;

      /* ================= Confetti ================= */
      function launchConfetti() {
        var canvas = document.getElementById('confetti-canvas');
        var ctx = canvas.getContext('2d');
        canvas.style.display = 'block';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var colors = ['#4F46E5', '#059669', '#F59E0B', '#0EA5E9', '#EC4899'];
        var parts = [];
        for (var i = 0; i < 110; i++) {
          parts.push({
            x: canvas.width * (0.2 + Math.random() * 0.6),
            y: canvas.height * 0.42 + (Math.random() - 0.5) * 60,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 12 - 3,
            sz: 6 + Math.random() * 6,
            c: colors[i % colors.length],
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.25,
            a: 1
          });
        }
        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          var alive = false;
          parts.forEach(function (p) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.26; p.vx *= 0.99; p.rot += p.vr;
            if (p.y > canvas.height * 0.78) p.a = Math.max(0, p.a - 0.025);
            if (p.a > 0.02 && p.y < canvas.height + 40) {
              alive = true;
              ctx.save(); ctx.globalAlpha = p.a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
              ctx.fillStyle = p.c; ctx.fillRect(-p.sz / 2, -p.sz / 3, p.sz, p.sz * 0.66);
              ctx.restore();
            }
          });
          if (alive) requestAnimationFrame(tick);
          else canvas.style.display = 'none';
        }
        requestAnimationFrame(tick);
      }

          grad.addColorStop(0, '#D97706'); grad.addColorStop(0.5, '#FCD34D'); grad.addColorStop(1, '#B45309');

          var holdHint = document.getElementById('hold-hint');
          var rafId = null, startT = 0, lastBucket = -1, activeHold = false;

          function stopHold() {
            if (!activeHold) return;
            activeHold = false;
            if (rafId) cancelAnimationFrame(rafId);
            lastBucket = -1;
            if (!state.reconciled) {
              state.approachProgress = 0;
              holdFill.style.transform = 'scaleX(0)';
              holdLabel.style.color = '#1e1b4b';

              holdHint.textContent = 'اضغط وفضّل ماسك لحد ١٠٠٪';
              updateStageVisuals();
            }

          function tick(now) {
            if (!activeHold) return;
            var p = Math.min(1, (now - startT) / 2100);
            state.approachProgress = p;
            var pctNow = Math.round(p * 100);

            updateStageVisuals();

            var bucket = Math.floor(p * 6);
            if (bucket !== lastBucket && p < 1) {
              lastBucket = bucket;
              sound.playHold(p);
            }

            if (p >= 1) {
              activeHold = false;
              state.reconciled = true;
              sound.playCelebration();
              launchConfetti();
              renderReconciliation();
              updateStageVisuals();
              return;

          holdBtn.addEventListener('pointercancel', stopHold);
        } else {
          document.getElementById('btn-next-6').addEventListener('click', function () {
            sound.playChime(4);
            state.scene = 7;
            renderScene();
          });
        }
      }

              '<p class="kicker">٠٧ · ونعتذر لبعض</p>' +
              '<h2 class="scene-title">&ldquo;وأنا كمان آسف لو..&rdquo;</h2>' +
              '<p class="scene-subtitle">يا ' + esc(state.recipientName) + '، لو في حاجة تحب تقولها في ختام الصلح اختار من الكروت أو اكتب كلمتك عشان تتحط جوه الشهادة الرسمية.</p>' +
              '<div class="choice-grid cols-2" style="margin-bottom:14px;">' + mutualHtml + '</div>' +
              '<div style="margin-bottom:14px;"><label class="field-label" for="inp-mut">أو اكتب جملة من عندك (اختياري)</label><textarea id="inp-mut" class="textarea-box" rows="2" placeholder="مثال: حصل خير، ومقامك محفوظ دايماً...">' + esc(state.mutualNote) + '</textarea></div>' +
              '<div style="margin-bottom:14px;"><span class="field-label" style="font-size:12px;">تقييم ختام الصلح</span><div class="choice-grid cols-3">' + rateHtml + '</div></div>' +
              '<div class="btn-row"><button type="button" class="btn-primary" style="background:linear-gradient(270deg,#d97706,#b45309,#312e81);" id="btn-issue-cert">🏅 إصدار شهادة الصلح الرسمية</button></div>' +
            '</div>';

          root.querySelectorAll('[data-mut]').forEach(function (b) {
            b.addEventListener('click', function () { sound.playTap(); state.mutualNote = b.getAttribute('data-mut'); renderCertificate(); });
          });
          root.querySelectorAll('[data-rate]').forEach(function (b) {
            b.addEventListener('click', function () { sound.playTap(); state.closingBadge = b.getAttribute('data-rate'); renderCertificate(); });
          });
          document.getElementById('inp-mut').addEventListener('input', function (e) { state.mutualNote = e.target.value; });
          document.getElementById('btn-issue-cert').addEventListener('click', function () {
            sound.playCelebration();
            state.certIssued = true;
            renderCertificate();
          });
          return;
        }

        var certPromisesHtml = promises.map(function (p) {
          return '<div style="border-radius:10px;border:1px solid #fde68a;background:#fff;padding:10px;text-align:right;"><div style="font-size:12px;font-weight:700;color:#1e1b4b;">' + esc(p.title) + '</div><div style="font-size:11px;color:#475569;margin-top:4px;">' + esc(p.detail) + '</div></div>';
        }).join('');

        root.innerHTML =
          '<div>' +
            '<div class="cert-outer">' +
              '<div class="cert-mid">' +
                '<div class="cert-inner">' +
                  '<svg class="cert-corner" style="top:8px;right:8px;" viewBox="0 0 32 32" fill="none"><path d="M30 2 H10 C5 2 2 5 2 10 V30" stroke="currentColor" stroke-width="2" /><circle cx="10" cy="10" r="2.5" fill="currentColor" /></svg>' +
                  '<svg class="cert-corner" style="top:8px;left:8px;" viewBox="0 0 32 32" fill="none"><path d="M2 2 H22 C27 2 30 5 30 10 V30" stroke="currentColor" stroke-width="2" /><circle cx="22" cy="10" r="2.5" fill="currentColor" /></svg>' +
                  '<svg class="cert-corner" style="bottom:8px;right:8px;" viewBox="0 0 32 32" fill="none"><path d="M30 30 H10 C5 30 2 27 2 22 V2" stroke="currentColor" stroke-width="2" /><circle cx="10" cy="22" r="2.5" fill="currentColor" /></svg>' +
                  '<svg class="cert-corner" style="bottom:8px;left:8px;" viewBox="0 0 32 32" fill="none"><path d="M2 30 H22 C27 30 30 27 30 22 V2" stroke="currentColor" stroke-width="2" /><circle cx="22" cy="22" r="2.5" fill="currentColor" /></svg>' +

                  '<div style="text-align:center;border-bottom:1px solid #fde68a;padding-bottom:18px;margin-bottom:18px;">' +
                    '<p style="margin:0 0 6px;font-size:11px;font-weight:700;color:#92400e;">وثيقة مودة واحترام متبادل · رقم SOLH-2026</p>' +
                    '<h2 class="font-display" style="margin:0 0 6px;font-size:36px;font-weight:700;color:#1e1b4b;">شهادة صلح رسمية</h2>' +
                    '<p style="margin:0 0 6px;font-size:13px;color:#475569;">تشهد هذه الوثيقة بتصفية النفوس وإغلاق باب الزعل بين</p>' +
                    '<p class="font-display" style="margin:0 0 6px;font-size:26px;font-weight:700;color:#312e81;">' + esc(state.senderName) + ' <span style="color:#d97706;">✦</span> ' + esc(state.recipientName) + '</p>' +
                    '<div style="font-size:12px;color:#64748b;">تحريراً في ' + esc(dateStr) + ' · <strong style="color:#047857;">' + esc(state.closingBadge) + '</strong></div>' +
                  '</div>' +

                  '<div style="margin-bottom:16px;">' +
                    '<div style="text-align:center;font-size:12px;font-weight:700;color:#78350f;margin-bottom:8px;">الوعود الثلاثة المحفوظة في برطمان العهد</div>' +
                    '<div class="choice-grid cols-3">' + certPromisesHtml + '</div>' +
                  '</div>' +

                  '<div style="border-radius:12px;border:1px solid #fde68a;background:rgba(255,251,235,0.6);padding:14px;text-align:center;margin-bottom:16px;">' +
                    '<div style="font-size:12px;font-weight:700;color:#78350f;margin-bottom:4px;">كلمة ' + esc(state.recipientName) + ' الختامية</div>' +
                    '<div class="font-display" style="font-size:18px;color:#1e293b;">&ldquo;' + esc(state.mutualNote.trim() || 'حصل خير، وربنا يديم الاحترام والتقدير.') + '&rdquo;</div>' +
                  '</div>' +

                  '<div style="border-radius:12px;border:1px solid #c7d2fe;background:linear-gradient(270deg,#eef2ff,#fff,#fffbeb);padding:14px;text-align:center;">' +
                    '<div style="font-size:12px;font-weight:600;color:#3730a3;">🎁 كوبون التعويض عن بُعد من ' + esc(state.senderName) + '</div>' +
                    '<div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:4px;">' + esc(giftSummary) + '</div>' +
                  '</div>' +

                  '<div class="cert-footer-grid">' +
                    '<div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px;">توقيع ' + esc(state.recipientName) + '</div>' + (state.signatureDataUrl ? '<img src="' + state.signatureDataUrl + '" alt="التوقيع" style="height:54px;object-fit:contain;" />' : '<div class="font-display" style="font-size:22px;font-weight:700;">' + esc(state.recipientName) + '</div>') + '<div style="height:1px;width:120px;background:#cbd5e1;margin:4px auto 0;"></div></div>' +
                    '<div><svg viewBox="0 0 110 110" style="width:92px;height:92px;"><circle cx="55" cy="55" r="46" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5" /><circle cx="55" cy="55" r="39" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3" /><text x="55" y="48" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">ميثاق مودة</text><text x="55" y="67" text-anchor="middle" fill="#065F46" font-size="12" font-weight="bold">مُعتمد ✓</text></svg></div>' +
                    '<div><div style="font-size:11px;font-weight:600;color:#64748b;margin-bottom:6px;">تأكيد ' + esc(state.senderName) + '</div><div class="font-display" style="font-size:24px;font-weight:700;color:#1e1b4b;">' + esc(state.senderName) + '</div><div style="height:1px;width:120px;background:#cbd5e1;margin:4px auto 0;"></div></div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<div class="btn-row" style="justify-content:space-between;">' +
              '<div style="display:flex;flex-wrap:wrap;gap:10px;">' +
                '<button type="button" class="btn-primary" id="btn-download-cert">⬇ حفظ الشهادة كصورة رسمية</button>' +
                '<button type="button" class="btn-amber" id="btn-copy-reply">نسخ رد الصلح لـ ' + esc(state.senderName) + '</button>' +
              '</div>' +
              '<button type="button" class="btn-outline" id="btn-restart">↻ إعادة الرحلة</button>' +
            '</div>' +
          '</div>';

        document.getElementById('btn-copy-reply').addEventListener('click', function () {
          sound.playChime(2);
          var replyTxt = 'يا ' + state.senderName + '، قبلت اعتذارك وطلعنا شهادة الصلح الرسمية بتاعتنا (' + state.closingBadge + '). واختياري للتعويض عن بُعد هو: ' + giftSummary + '.';
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(replyTxt).catch(function () {});
          this.textContent = '✓ تم نسخ رسالة الرد';
        });

        document.getElementById('btn-restart').addEventListener('click', function () {
          sound.playTap();
          state.scene = 0;
          state.certIssued = false;
          renderScene();
        });

        document.getElementById('btn-download-cert').addEventListener('click', function () {
          sound.playChime(3);
          var c = document.createElement('canvas');
          c.width = 1400; c.height = 1720;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#FFFDF7'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.strokeStyle = '#1E1B4B'; ctx.lineWidth = 10; ctx.strokeRect(44, 44, c.width - 88, c.height - 88);
          ctx.strokeStyle = '#B45309'; ctx.lineWidth = 4; ctx.strokeRect(64, 64, c.width - 128, c.height - 128);
          ctx.strokeStyle = '#D97706'; ctx.lineWidth = 1.5; ctx.strokeRect(78, 78, c.width - 156, c.height - 156);
          ctx.direction = 'rtl'; ctx.textAlign = 'center';
          ctx.fillStyle = '#92400E'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('وثيقة مودة واحترام متبادل · رقم SOLH-2026', 700, 155);
          ctx.fillStyle = '#1E1B4B'; ctx.font = 'bold 72px serif'; ctx.fillText('شهادة صلح رسمية', 700, 248);
          ctx.fillStyle = '#334155'; ctx.font = '28px sans-serif'; ctx.fillText('تشهد هذه الوثيقة بتصفية النفوس وتجديد الود والاحترام بين', 700, 352);
          ctx.fillStyle = '#1E1B4B'; ctx.font = 'bold 46px serif'; ctx.fillText(state.senderName + '   ✦   ' + state.recipientName, 700, 424);
          ctx.fillStyle = '#64748B'; ctx.font = '24px sans-serif'; ctx.fillText('تحريراً في ' + dateStr + ' · ' + state.closingBadge, 700, 476);

          ctx.fillStyle = '#F8FAFC'; ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 2; ctx.fillRect(130, 520, 1140, 300); ctx.strokeRect(130, 520, 1140, 300);
          ctx.fillStyle = '#92400E'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('الوعود الثلاثة المحفوظة في برطمان العهد', 700, 575);
          ctx.fillStyle = '#1E293B'; ctx.font = '24px sans-serif';
          promises.forEach(function (p, i) { ctx.fillText('✦  ' + p.title + ': ' + p.detail, 700, 640 + i * 54); });

          ctx.fillStyle = '#FEFCE8'; ctx.strokeStyle = '#FDE68A'; ctx.fillRect(130, 855, 1140, 150); ctx.strokeRect(130, 855, 1140, 150);
          ctx.fillStyle = '#92400E'; ctx.font = 'bold 25px sans-serif'; ctx.fillText('كلمة ' + state.recipientName + ' الختامية', 700, 908);
          ctx.fillStyle = '#1E293B'; ctx.font = '26px sans-serif'; ctx.fillText('"' + (state.mutualNote.trim() || 'حصل خير، وربنا يديم الاحترام والتقدير.').slice(0, 74) + '"', 700, 962);

          ctx.fillStyle = '#EEF2FF'; ctx.strokeStyle = '#A5B4FC'; ctx.fillRect(180, 1045, 1040, 145); ctx.strokeRect(180, 1045, 1040, 145);
          ctx.fillStyle = '#312E81'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('كوبون التعويض عن بُعد: ' + giftSummary, 700, 1105);
          ctx.fillStyle = '#4338CA'; ctx.font = '23px sans-serif'; ctx.fillText('هدية تصلك من ' + state.senderName + ' لحد عندك', 700, 1152);

          ctx.fillStyle = '#FEF3C7'; ctx.strokeStyle = '#B45309'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(700, 1370, 92, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#92400E'; ctx.font = 'bold 22px sans-serif'; ctx.fillText('ميثاق مودة', 700, 1358);
          ctx.fillStyle = '#065F46'; ctx.fillText('مُعتمد ✓', 700, 1396);

          ctx.fillStyle = '#475569'; ctx.font = 'bold 22px sans-serif';
          ctx.fillText('توقيع ' + state.recipientName, 320, 1290);
          ctx.fillText('تأكيد ' + state.senderName, 1080, 1290);
          ctx.fillStyle = '#1E1B4B'; ctx.font = 'bold 34px serif'; ctx.fillText(state.senderName, 1080, 1380);

          function finishDownload() {
            var a = document.createElement('a');
            a.download = 'shihadat-solh-' + (state.recipientName || 'khaled') + '.png';
            a.href = c.toDataURL('image/png');
            a.click();
          }
          if (state.signatureDataUrl) {
            var si = new Image();
            si.onload = function () { ctx.drawImage(si, 170, 1310, 300, 120); finishDownload(); };
            si.onerror = finishDownload;
            si.src = state.signatureDataUrl;
          } else {
            finishDownload();
          }
        });
      }

      /* ================= Global Header Listeners ================= */
      document.getElementById('brand-home-btn').addEventListener('click', function () {
        sound.playTap();
        state.scene = 0;
        renderScene();
      });

      document.getElementById('btn-back').addEventListener('click', function () {
        if (state.scene > 0) {
          sound.playTap();
          state.scene -= 1;
          renderScene();
        }
      });

      document.getElementById('btn-ambient').addEventListener('click', function () {
        var order = ['off', 'music', 'nature'];
        var next = order[(order.indexOf(sound.ambientMode) + 1) % order.length];
        if (next !== 'off' && sound.muted) sound.setMuted(false);
        sound.setAmbientMode(next);
        updateChrome();
        if (state.scene === 1) renderConfession();
      });

      document.getElementById('btn-mute').addEventListener('click', function () {
        sound.setMuted(!sound.muted);
        if (!sound.muted) sound.playTap();
        updateChrome();
      });

      renderScene();
    })();
  </script>
</body>
</html>
